  <title id="title">Sistema de identidade visual JJ Builder</title>
  <desc id="desc">Apresentação do monograma, assinatura horizontal, redução e versões de cor da marca JJ Builder</desc>
  <rect width="1600" height="1000" fill="#090909"/>
  <text x="96" y="104" fill="#F36A18" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">JJ BUILDER · IDENTIDADE</text>
  <text x="96" y="164" fill="#FFFFFF" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="400">Dois J. Uma progressão. Liderança que avança.</text>

