  <text x="790" y="816" fill="#FFFFFF" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="600">Experiência que eleva.</text>
  <text x="790" y="860" fill="#A8A8A8" font-family="Source Sans 3, Arial, sans-serif" font-size="21">Sem prédio. Sem tijolo. Sem seta.</text>
  <text x="790" y="894" fill="#A8A8A8" font-family="Source Sans 3, Arial, sans-serif" font-size="21">A própria estrutura dos J comunica avanço.</text>
